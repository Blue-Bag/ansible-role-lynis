---
# defaults file for lynis

lynis_version: 3.0.8
lynis_version_sha256sum: 98373a4cc9d0471ab9bebb249e442fcf94b6bf6d4e9c6fc0b22bca1506646c63


lynis_use_packages: True

lynis_src_directory: /usr/local/src

lynis_dest_directory: /opt

lynis_log_directory: /var/log/lynis

lynis_cron: yes
lynis_cron_weekday: "*"
lynis_cron_hour: '3'
lynis_cron_minute: '30'

# create a local config override
lynis_custom_cfg: yes
lynis_custom_cfg_path: 'templates/custom.prf.j2'

lynis_cert_search_paths:
   - '/etc/apache2'
   - '/etc/dovecot'
   - '/etc/httpd'
   - '/etc/letsencrypt/live'
   - '/etc/pki'
   - '/etc/postfix'
   - '/etc/ssl'
   - '/opt/psa/var/certificates'
   - '/usr/local/psa/var/certificates'
   - '/usr/local/share/ca-certificates'
   - '/var/www'
   - '/srv/www'
   - '/etc/haproxy/ssl'
   - '/root/.acme.sh'
