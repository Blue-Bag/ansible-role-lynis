---

- name: Lynis | Install Lynis (Debian | Ubuntu)
  include_tasks: package.yml
  when:
      (lynis_use_packages is defined and lynis_use_packages)
  tags: lynis


- name: Lynis | Install Lynis manually (OS-independent)
  include_tasks: manual-install.yml
  when: lynis_use_packages is defined and not lynis_use_packages
  tags: lynis

- name: Ensure Lynis log directory exists (when lynis_cron).
  file:
    path: "{{ lynis_log_directory }}"
    state: directory
    mode: 0750
  become: yes
  when: lynis_cron | bool

- name: Configure Lynis cron task (when lynis_cron).
  cron:
    name: Run Lynis
    cron_file: lynis
    minute: "{{ lynis_cron_minute }}"
    hour: "{{ lynis_cron_hour }}"
    weekday: "{{ lynis_cron_weekday }}"
    user: root
    job: cd {{ lynis_dest_directory }}/lynis && ./lynis audit system --auditor "automated" --cronjob > {{ lynis_log_directory }}/report-$(hostname).$(date +%Y%m%d).txt && mv /var/log/lynis.log {{ lynis_log_directory }}/report-log-$(hostname).$(date +%Y%m%d).log && mv /var/log/lynis-report.dat {{ lynis_log_directory }}/report-data-$(hostname).$(date +%Y%m%d).txt >/dev/null 2>&1
  become: yes
  when: lynis_cron | bool

- name: Ensure Lynis cfg directory exists.
  file:
    path: "{{ lynis_cfg_directory }}"
    state: directory
  become: yes

- name: Configure custom configuration
  template:
    src: "{{ lynis_custom_cfg_path }}"
    dest: "{{ lynis_cfg_directory }}/custom.prf"
    backup: no
  become: true
  when: lynis_custom_cfg | bool
